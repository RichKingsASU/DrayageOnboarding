name: Validate
on:
  pull_request:
    branches: [ main, staging ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Secret pattern scan
        run: |
          ! rg -n --hidden -g '!node_modules' -g '!package-lock.json' -g '!package.json' -g '!.git' \
            '(SuperSecurePassword123!|SUPABASE_SERVICE_ROLE_KEY=.*eyJ|--public-access 0\.0\.0\.0|MAJOR_CAPABILITY_SERVER_SIDE_GEMINI_API|react-example)'

