name: Validate
on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck || echo "typecheck not present"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check Git Diff
        run: git diff --check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Reset DB
        run: supabase db reset

      - name: Run Supabase Tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop
