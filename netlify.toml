[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing - redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Required environment variables for staging:
# VITE_SUPABASE_URL=https://seepoiewfnvdjskywcmc.supabase.co
# VITE_SUPABASE_ANON_KEY=<anon key from supabase dashboard>
# VITE_AUTH_MODE=auto_demo
# VITE_APP_ENV=staging
# Set these in the Netlify dashboard under Site settings > Environment variables
